version: 2
updates:
  # Paused: bulk major bumps (RN/Expo/TS) were flooding the repo after
  # production program merge. Re-enable by setting open-pull-requests-limit > 0
  # and triaging updates deliberately (prefer grouped/minor-only policies).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
