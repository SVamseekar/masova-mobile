name: CI - Customer App

on:
  push:
    branches: [main, develop, security-remediation-plan-b]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *' # Nightly 2 AM UTC run for E2E smoke tests
  workflow_dispatch: # Manual trigger for E2E smoke testing

jobs:
  lint-typecheck-test:
    # Job display name must match branch protection required check: "Lint and Type Check"
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm run test:ci

  e2e-smoke-test:
    name: Nightly / Manual Staging API Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Staging Backend API Smoke Test
        env:
          API_BASE_URL: 'http://192.168.50.88:8080/api'
          ALLOW_SKIP_IF_UNREACHABLE: 'true'
        run: npm run smoke:dell

